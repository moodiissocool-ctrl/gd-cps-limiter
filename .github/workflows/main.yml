
name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Android64

      - name: Upload Geode file
        uses: actions/upload-artifact@v4
        with:
          name: CPSLimiter
          path: ${{ steps.build.outputs.build-output }}/*.geode
          
